services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coastride
      POSTGRES_PASSWORD: coastride
      POSTGRES_DB: coastride
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastride -d coastride"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: coastride
      POSTGRES_PASSWORD: coastride
      POSTGRES_DB: coastride_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://coastride:coastride@db:5432/coastride"
      PORT: 3000
      HOST: 0.0.0.0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in your .env file}
      NODE_ENV: production
      AT_ENABLED: "false"
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  pgdata:
  pgdata_test:
