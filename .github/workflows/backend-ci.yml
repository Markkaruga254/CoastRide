name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coastride
          POSTGRES_PASSWORD: coastride
          POSTGRES_DB: coastride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coastride -d coastride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://coastride:coastride@localhost:5432/coastride_test
          TEST_DATABASE_URL=postgresql://coastride:coastride@localhost:5432/coastride_test
          PORT=3000
          HOST=127.0.0.1
          WEBHOOK_SECRET=ci-only-webhook-secret-0123456789abcdef
          AT_ENABLED=false
          AT_USERNAME=
          AT_API_KEY=
          CRON_SECRET=ci-only-cron-secret-0123456789abcdef
          LOG_LEVEL=error
          EOF

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Docker Compose startup smoke test
        run: |
          export DB_HOST_PORT=55432
          export WEBHOOK_SECRET=ci-only-webhook-secret-0123456789abcdef
          export CRON_SECRET=ci-only-cron-secret-0123456789abcdef
          trap 'docker compose down -v' EXIT
          docker compose up --build -d db app
          if ! curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health; then
            docker compose ps -a
            APP_ID=$(docker compose ps -aq app)
            if [ -n "$APP_ID" ]; then
              docker inspect "$APP_ID" --format 'app exit={{.State.ExitCode}} error={{.State.Error}} path={{.Path}} args={{json .Args}}'
            fi
            docker compose run --rm --entrypoint sh app -c 'echo ENTRY_FILE; ls -l dist/start.js; sed -n "1,40p" dist/start.js; echo PRISMA_CLI; ls -l node_modules/.bin/prisma; npx prisma --version'
            docker compose logs --no-color app db
            exit 1
          fi
